name: Build Web Client

on:
  workflow_dispatch:
  push:
    # 每个分支的每次 push 都自动构建（feature/*、fix/*、main 等），
    # 这样推送后能立刻在 Actions 产物里看到改动。
    branches: ["**"]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"

jobs:
  # 结果 1/2：TMS 集成用 npm 包（.tgz）
  build-tgz:
    name: 1-tms-integration-tgz
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python3 zip

      # 先跑代码生成（ts_proto.py / gen_js_from_hbb.py 产出
      # message.ts / rendezvous.ts 等，这些文件被 .gitignore 忽略，CI 必须现生成），
      # 再 tsc + vite build。Python/protoc 仅用于构建侧，同事 npm install 产物不需要。
      - name: Build TS UI (codegen + tsc + vite)
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install protoc -g
          yarn install --frozen-lockfile || yarn install
          yarn build
          popd

      - name: Download web deps
        run: |
          wget -q -O /tmp/web_deps.tar.gz https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          mkdir -p web_deps
          tar tzf /tmp/web_deps.tar.gz >/dev/null || { echo "web_deps download corrupted"; exit 1; }
          tar xzf /tmp/web_deps.tar.gz -C web_deps/

      # tag v1.2.3 -> NPM_VERSION=1.2.3；手动运行/分支 push -> 0.1.0-dev.<run>
      - name: Compute package version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NPM_VERSION="${GITHUB_REF_NAME#v}"
          else
            NPM_VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble tgz
        shell: bash
        run: |
          chmod +x embed/build-lib.sh
          WEB_DEPS_DIR="$PWD/web_deps" \
          NPM_VERSION="${{ steps.ver.outputs.npm_version }}" \
            bash embed/build-lib.sh "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"

      # GitHub 下载 artifact 会套一层 zip，里面就是这个 .tgz。
      - name: Upload artifact 1 - TMS integration (tgz)
        uses: actions/upload-artifact@v4
        with:
          name: 1-tms-integration-sundesk-web-client-${{ steps.ver.outputs.npm_version }}
          path: outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }}.tgz
          if-no-files-found: error

      - name: Upload tgz to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }}.tgz

  # 结果 2/2：本地 PC 整站包（原始连接页，可手填 IP / key / SN）
  build-local-pc:
    name: 2-local-pc-website
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python3 zip

      # 纯 vite 构建 + 手工组装静态站点（flutter build 会尊重 .gitignore 漏掉产物）。
      - name: Build TS UI (vite)
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install protoc -g
          yarn install && yarn build
          popd

      - name: Download web deps
        run: |
          wget -q -O /tmp/web_deps.tar.gz https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar tzf /tmp/web_deps.tar.gz >/dev/null || { echo "web_deps download corrupted"; exit 1; }

      - name: Assemble static site
        shell: bash
        run: |
          set -e
          mkdir -p site
          # vite 产物（index.html 引用 ./index.js、./vendor.js 相对路径）
          cp -r flutter/web/js/dist/* site/
          # web deps：ogvjs-1.8.6/、yuv-canvas-1.2.6.js、libopus.js/wasm
          tar xzf /tmp/web_deps.tar.gz -C site/
          # 其余静态资源
          cp flutter/web/yuv.js flutter/web/yuv.wasm flutter/web/favicon.svg site/

      # 单层根文件夹：下载 artifact 解压后直接是 sundesk-web/，
      # cd 进去 python -m http.server 即可，无第二层嵌套。
      - name: Stage single root folder
        run: |
          mkdir -p pkg
          cp -r site pkg/sundesk-web

      - name: Upload artifact 2 - local PC website
        uses: actions/upload-artifact@v4
        with:
          name: 2-local-pc-sundesk-web-${{ env.VERSION }}-${{ github.run_number }}
          path: pkg/*

      - name: Publish release zip (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd pkg && zip -r ../sundesk-web-${{ env.VERSION }}-web-basic.zip sundesk-web
      - name: Upload zip to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sundesk-web-${{ env.VERSION }}-web-basic.zip
