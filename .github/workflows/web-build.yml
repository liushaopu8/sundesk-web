name: Build Web Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"
  FLUTTER_VERSION: "3.19.6"

jobs:
  build-web:
    name: build-sundesk-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # https://rustdesk.com/docs/en/dev/build/web/
      - name: Build JS deps
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install typescript -g
          npm install protoc -g
          # ts-proto/vite 已声明在 package.json，勿用 npm 单独安装（会重写依赖树导致版本漂移）
          yarn install && yarn build
          popd

      - name: Download web deps
        shell: bash
        run: |
          pushd flutter/web
          wget https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz
          popd

      - name: Build web (release)
        shell: bash
        run: |
          pushd flutter
          flutter build web --release
          popd

      - name: Package
        shell: bash
        run: |
          pushd flutter/build
          dir_name="sundesk-web-${{ env.VERSION }}-web-basic"
          mv web "${dir_name}" && tar czf "${dir_name}".tar.gz "${dir_name}"
          sha256sum "${dir_name}".tar.gz
          popd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sundesk-web-${{ env.VERSION }}
          path: flutter/build/sundesk-web-*.tar.gz

      # GitHub Pages 部署：需要 --base-href 指向仓库路径，与正式产物分开构建
      - name: Build web for GitHub Pages
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          pushd flutter
          flutter build web --release --base-href=/sundesk-web/
          popd

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: flutter/build/web
          publish_branch: gh-pages

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/sundesk-web-*.tar.gz
