name: Build Web Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"

jobs:
  build-web:
    name: build-sundesk-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python3

      # 不再使用 flutter build：flutter 复制静态资源时尊重 .gitignore，
      # 会过滤掉 vite 产物（js/dist）和 web_deps（ogvjs*/yuv-canvas*/libopus*），
      # 导致线上 404。改为纯 vite 构建 + 手工组装静态站点。
      - name: Build TS UI (vite)
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install protoc -g
          yarn install && yarn build
          popd

      - name: Download web deps
        run: |
          wget -q -O /tmp/web_deps.tar.gz https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar tzf /tmp/web_deps.tar.gz >/dev/null || { echo "web_deps download corrupted"; exit 1; }

      - name: Assemble static site
        shell: bash
        run: |
          set -e
          mkdir -p site
          # vite 产物（index.html 引用 ./index.js、./vendor.js 相对路径）
          cp -r flutter/web/js/dist/* site/
          # web deps：ogvjs-1.8.6/、yuv-canvas-1.2.6.js、libopus.js/wasm
          tar xzf /tmp/web_deps.tar.gz -C site/
          # 其余静态资源
          cp flutter/web/yuv.js flutter/web/yuv.wasm flutter/web/favicon.svg site/
          ls -la site/

      - name: Package artifact
        run: |
          tar czf sundesk-web-${{ env.VERSION }}-web-basic.tar.gz site
          sha256sum sundesk-web-${{ env.VERSION }}-web-basic.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sundesk-web-${{ env.VERSION }}
          path: sundesk-web-${{ env.VERSION }}-web-basic.tar.gz

      # GitHub Pages 部署已停用（2026-08-21）：Pages 是 https，浏览器强制 wss://，
      # 本地 rustdesk-server 的 hbbs/hbbr 是明文 ws，无 TLS 反代连不上。
      # 测试改走本地构建（artifact / 本地 http server）。
      # - name: Deploy to GitHub Pages
      #   if: github.ref == 'refs/heads/main'
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: site
      #     publish_branch: gh-pages

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sundesk-web-${{ env.VERSION }}-web-basic.tar.gz
