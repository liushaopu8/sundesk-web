name: Build Web Client

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"
  FLUTTER_VERSION: "3.19.6"

jobs:
  build-web:
    name: build-sundesk-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # https://rustdesk.com/docs/en/dev/build/web/
      - name: Build JS deps
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install typescript -g
          npm install protoc -g
          npm install ts-proto
          # Only works with vite <= 2.8, see: https://github.com/vitejs/vite/blob/main/docs/guide/build.md#chunking-strategy
          npm install vite@2.8
          yarn install && yarn build
          popd

      - name: Download web deps
        shell: bash
        run: |
          pushd flutter/web
          wget https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar xzf web_deps.tar.gz
          popd

      - name: Build web (release)
        shell: bash
        run: |
          pushd flutter
          flutter build web --release
          popd

      - name: Package
        shell: bash
        run: |
          pushd flutter/build
          dir_name="sundesk-web-${{ env.VERSION }}-web-basic"
          mv web "${dir_name}" && tar czf "${dir_name}".tar.gz "${dir_name}"
          sha256sum "${dir_name}".tar.gz
          popd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sundesk-web-${{ env.VERSION }}
          path: flutter/build/sundesk-web-*.tar.gz

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/sundesk-web-*.tar.gz
