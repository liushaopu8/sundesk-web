name: Build Web Client

on:
  workflow_dispatch:
  push:
    # 每个分支的每次 push 都自动构建（feature/*、fix/*、main 等），
    # 这样推送到 feature/session-toolbar 等分支后能立刻在 Actions 产物里看到改动。
    branches: ["**"]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"

jobs:
  build-web:
    name: build-sundesk-web
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python3 zip

      # 不再使用 flutter build：flutter 复制静态资源时尊重 .gitignore，
      # 会过滤掉 vite 产物（js/dist）和 web_deps（ogvjs*/yuv-canvas*/libopus*），
      # 导致线上 404。改为纯 vite 构建 + 手工组装静态站点。
      - name: Build TS UI (vite)
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install protoc -g
          yarn install && yarn build
          popd

      - name: Download web deps
        run: |
          wget -q -O /tmp/web_deps.tar.gz https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          tar tzf /tmp/web_deps.tar.gz >/dev/null || { echo "web_deps download corrupted"; exit 1; }

      - name: Assemble static site
        shell: bash
        run: |
          set -e
          mkdir -p site
          # vite 产物（index.html 引用 ./index.js、./vendor.js 相对路径）
          cp -r flutter/web/js/dist/* site/
          # web deps：ogvjs-1.8.6/、yuv-canvas-1.2.6.js、libopus.js/wasm
          tar xzf /tmp/web_deps.tar.gz -C site/
          # 其余静态资源
          cp flutter/web/yuv.js flutter/web/yuv.wasm flutter/web/favicon.svg site/
          ls -la site/

      - name: Assemble single folder
        run: |
          mkdir -p pkg/sundesk-web
          cp -r site/* pkg/sundesk-web/
          # path 用 pkg/* 通配符：GitHub artifact 下载解压后直接是 sundesk-web/ 文件夹
          # （upload-artifact 对通配符会自动展开一层，避免二次解压）

      # 产物名带上分支名 + 运行号，避免不同分支/多次 push 的产物互相覆盖，
      # 下载时一眼能看出是哪个分支的构建（如 sundesk-web-1.2.5-feature-session-toolbar-42）。
      - name: Compute artifact name
        id: art
        run: |
          REF="${GITHUB_REF_NAME}"            # 分支名或 tag 名
          SAFE=$(echo "$REF" | tr '/ ' '--' | tr -cd 'A-Za-z0-9._-')
          NAME="sundesk-web-${VERSION}-${SAFE}-${GITHUB_RUN_NUMBER}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Artifact name: $NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: pkg/*

      # GitHub Pages 部署已停用（2026-08-21）：Pages 是 https，浏览器强制 wss://，
      # 本地 rustdesk-server 的 hbbs/hbbr 是明文 ws，无 TLS 反代连不上。
      # 测试改走本地构建（artifact / 本地 http server）。
      # - name: Deploy to GitHub Pages
      #   if: github.ref == 'refs/heads/main'
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: site
      #     publish_branch: gh-pages

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd pkg && zip -r ../sundesk-web-${{ env.VERSION }}-web-basic.zip sundesk-web
        shell: bash
      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: sundesk-web-${{ env.VERSION }}-web-basic.zip
