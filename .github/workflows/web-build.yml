name: Build Web Client

on:
  workflow_dispatch:
  push:
    # 每个分支的每次 push 都自动构建（feature/*、fix/*、main 等），
    # 这样推送后能立刻在 Actions 产物里看到改动。
    branches: ["**"]
    tags: ["*"]
  pull_request:

env:
  VERSION: "1.2.5"

jobs:
  build-embed-lib:
    name: build-sundesk-web-client
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget npm python3 zip

      # 先跑代码生成（ts_proto.py / gen_js_from_hbb.py 产出
      # message.ts / rendezvous.ts 等，这些文件被 .gitignore 忽略，CI 必须现生成），
      # 再 tsc + vite build。Python/protoc 仅用于构建侧，同事 npm install 产物不需要。
      - name: Build TS UI (codegen + tsc + vite)
        shell: bash
        run: |
          pushd flutter/web/js
          npm install yarn -g
          npm install protoc -g
          yarn install --frozen-lockfile || yarn install
          yarn build
          popd

      - name: Download web deps
        run: |
          wget -q -O /tmp/web_deps.tar.gz https://github.com/rustdesk/doc.rustdesk.com/releases/download/console/web_deps.tar.gz
          mkdir -p web_deps
          tar tzf /tmp/web_deps.tar.gz >/dev/null || { echo "web_deps download corrupted"; exit 1; }
          tar xzf /tmp/web_deps.tar.gz -C web_deps/

      # tag v1.2.3 -> NPM_VERSION=1.2.3；手动运行/分支 push -> 0.1.0-dev.<run>
      - name: Compute package version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NPM_VERSION="${TAG#v}"
          else
            NPM_VERSION="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_VERSION=$NPM_VERSION"

      # 产出 outputs/：
      #   sundesk-web-client-<version>.tgz                      （TMS 集成用）
      #   sundesk-web-client-<version>/   单层根文件夹（本地 PC 用）
      #   sundesk-web-client-<version>.zip                      （仅 tag Release 用）
      - name: Assemble packages
        shell: bash
        run: |
          chmod +x embed/build-lib.sh
          WEB_DEPS_DIR="$PWD/web_deps" \
          NPM_VERSION="${{ steps.ver.outputs.npm_version }}" \
            bash embed/build-lib.sh "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"

      # 结果 1/2：TMS 集成 tgz。GitHub 下载 artifact 会套一层 zip，里面就是这个 .tgz。
      - name: Upload artifact 1 - TMS integration (tgz)
        uses: actions/upload-artifact@v4
        with:
          name: 1-tms-integration-sundesk-web-client-${{ steps.ver.outputs.npm_version }}
          path: outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }}.tgz
          if-no-files-found: error

      # 结果 2/2：本地 PC 包。先把单层根文件夹放进干净的暂存目录，再用 stage/* 通配
      # 上传（与旧 build-web 的 pkg/* 同款机制）：GitHub 下载时套的那层 zip 解压后
      # 直接是 sundesk-web-client-<version>/，没有第二层嵌套。
      # 用法：解压 -> cd sundesk-web-client-<version> -> python -m http.server。
      - name: Stage local PC artifact
        run: |
          mkdir -p local-artifact
          cp -r outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }} local-artifact/
      - name: Upload artifact 2 - local PC package
        uses: actions/upload-artifact@v4
        with:
          name: 2-local-pc-sundesk-web-client-${{ steps.ver.outputs.npm_version }}
          path: local-artifact/*
          if-no-files-found: error

      # 打 tag 时把 tgz + zip 挂到 GitHub Release（Release 为原始文件下载，zip 单层无嵌套）
      - name: Upload release assets (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }}.tgz
            outputs/sundesk-web-client-${{ steps.ver.outputs.npm_version }}.zip
